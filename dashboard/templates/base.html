<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titolo %}Kindling{% endblock %} — Kindling</title>
<style>
  /* Nessuna risorsa esterna: niente CDN, niente font remoti. La dashboard sta
     dietro un tunnel SSH e non deve dipendere da internet per rendersi. */
  :root {
    --testo: #1d1d1f; --tenue: #6b6b70; --fondo: #fafaf8; --riga: #e3e3de;
    --grigio: #8a8a8f; --grigio-fondo: #efefeb;
    --avviso: #7a4b00; --avviso-fondo: #fff4dc; --avviso-bordo: #e7b84d;
    --errore: #8f1d1d; --errore-fondo: #fde8e8; --errore-bordo: #d64545;
  }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: var(--testo); background: var(--fondo); }
  .pagina { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  header.sito { border-bottom: 1px solid var(--riga); margin-bottom: 1.5rem; padding-bottom: .75rem; }
  header.sito a { color: inherit; text-decoration: none; font-weight: 600; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
  .sottotitolo { color: var(--tenue); margin: 0 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid var(--riga); vertical-align: top; }
  th { font-weight: 600; color: var(--tenue); font-size: .85rem; }
  .scorri { overflow-x: auto; }
  code, pre { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .85rem; }
  pre { background: var(--grigio-fondo); padding: .75rem; overflow-x: auto; margin: .25rem 0; }
  .nota { color: var(--tenue); font-size: .9rem; }

  /* Avviso: un fatto che cambia la lettura dei dati. NON un errore. */
  .avviso { background: var(--avviso-fondo); border-left: 4px solid var(--avviso-bordo);
            color: var(--avviso); padding: .75rem 1rem; margin: 1rem 0; }
  .avviso strong { display: block; margin-bottom: .25rem; }

  /* Errore: l'API non risponde. Deve somigliare a NIENT'ALTRO della pagina
     (dashboard.md 5, regola 1). */
  .errore { background: var(--errore-fondo); border: 2px solid var(--errore-bordo);
            color: var(--errore); padding: 1rem 1.25rem; }

  /* --- celle di qualificazione (dashboard.md 5) --------------------------- */
  .cella { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: .35rem; }
  .cella__testo { font-variant-numeric: tabular-nums; }
  .cella__spiegazione { color: var(--tenue); font-size: .85rem; }
  .cella--soppresso .cella__testo { color: var(--grigio); font-style: italic; }
  .cella--soppresso .cella__simbolo { color: var(--grigio); }
  .cella--non_calcolabile .cella__testo { color: var(--grigio); }
  .cella--mediana_non_raggiunta .cella__testo { font-style: italic; }
  .cella--assente .cella__testo { color: var(--grigio); }
  /* Un numero non significativo si mostra, ma dequalificato. */
  .cella--valore.cella--dequalificata .cella__testo { color: var(--grigio); }
  .etichetta { font-size: .75rem; padding: 0 .4rem; border-radius: .6rem; white-space: nowrap; }
  .etichetta--non_significativo { background: var(--grigio-fondo); color: var(--tenue); }
  .etichetta--solo_sopravvissuti { background: var(--avviso-fondo); color: var(--avviso);
                                   white-space: normal; }
</style>
</head>
<body>
<div class="pagina">
  <header class="sito"><a href="/">Kindling</a></header>
  {% block contenuto %}{% endblock %}
</div>
</body>
</html>

# Ambiente di sviluppo locale, e configurazione usata anche in produzione
# sulla droplet DigitalOcean (bot/api/job girano sulla stessa droplet) — vedi
# docs/architettura/architettura.md.
#
# Postgres non pubblica MAI la porta su tutte le interfacce (niente
# "5432:5432", che equivale a "0.0.0.0:5432:5432" — raggiungibile da
# internet, la causa di un incidente reale, vedi CLAUDE.md). E'
# invece pubblicata SOLO sul loopback dell'host ("127.0.0.1:5432:5432"):
# non raggiungibile dall'esterno in nessun caso, ma raggiungibile da un
# tunnel SSH aperto su quella stessa macchina — è quello che rende
# possibile il workflow "analisi locale via tunnel SSH" descritto nel
# README, che altrimenti (porta non pubblicata affatto) non avrebbe nulla
# a cui collegarsi neanche da dentro la droplet stessa.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kindling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kindling}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # I file in initdb.d vengono eseguiti automaticamente, in ordine
      # alfabetico, solo al primo avvio (volume dati vuoto). Applica quindi
      # 0001_raw_events.sql e ogni migrazione futura numerata di conseguenza.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    # NESSUN mem_limit, e non e' una dimenticanza (bot invece ce l'ha: vedi
    # sotto). Postgres e' l'unica cosa che non si vuole vedere uccisa a meta'
    # di una scrittura, e un tetto troppo basso non lo fa degradare: lo fa
    # morire. La sua protezione e' la sua configurazione (shared_buffers,
    # work_mem, max_connections), non un limite del container — e il tetto
    # degli altri servizi esiste proprio perche' sotto pressione muoiano loro,
    # non lui (architettura.md, sezione Hosting).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kindling} -d ${POSTGRES_DB:-kindling}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sovrascrive DATABASE_URL dell'.env per puntare al postgres del
      # compose invece che all'istanza online.
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindling}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kindling}
    # Il tetto qui non e' per l'OOM dell'host ma per le perdite: un processo
    # Python di lunga durata connesso al gateway, dove una perdita di memoria
    # cresce in silenzio per giorni. Con il tetto diventa un riavvio visibile
    # (OOMKilled e RestartCount in `docker inspect`, restart: unless-stopped lo
    # rimette in piedi) invece di un sistema strozzato. 128m su 18 MB misurati
    # a regime (docker stats, 19/09/2026): ~7x, piu' largo del ~3x di caddy e
    # dashboard perche' il bot ha picchi che loro non hanno — il backfill dei
    # membri all'avvio e il riallineamento della cache dopo una riconnessione
    # al gateway — e il numero misurato e' quello a riposo. Da riguardare se
    # cresce il numero di membri osservati. Postgres invece NON ha un tetto, di
    # proposito: vedi il commento sul servizio.
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy

  # API di sola lettura sugli aggregati. NESSUN `ports:` pubblicato, ed e' una
  # scelta, non una dimenticanza: il servizio e' raggiungibile dagli altri
  # container sulla rete interna del compose e, per lo sviluppo, via tunnel SSH
  # — come Postgres. TLS e autenticazione sono il prerequisito del momento in
  # cui l'API diventa raggiungibile da fuori, cioe' quando esistera' il
  # dashboard, non un affinamento successivo (docs/architettura/api.md 5).
  # Aggiungere `ports:` qui senza aver fatto quel passo e' la versione API
  # dell'incidente descritto in CLAUDE.md.
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ruolo di SOLA LETTURA (migration 0010), non il proprietario usato da bot
      # e job: e' cio' che rende il perimetro di api.md 1 una garanzia del
      # database invece di una convenzione.
      API_DATABASE_URL: ${API_DATABASE_URL}
    # Budget stimato ~80-120 MB (architettura.md, sezione Hosting). Il tetto
    # esiste perche' se qualcosa deve morire per esaurimento memoria non deve
    # essere Postgres o il bot.
    mem_limit: 200m
    # 1 worker: piu' worker moltiplicherebbero la RAM su una macchina che non ha
    # CPU da parallelizzare (1 vCPU condiviso con l'heartbeat del gateway).
    command:
      ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # Dashboard server-rendered (docs/architettura/dashboard.md 8, fase 1). Parla
  # SOLO con l'API, via HTTP sulla rete interna del compose: il browser non chiama
  # mai l'API.
  #
  # Porta pubblicata SOLO sul loopback dell'host ("127.0.0.1:8000:8000"), come
  # postgres: non raggiungibile da internet in nessun caso, ma e' cio' a cui si
  # appoggia il tunnel SSH (`ssh -L 8000:localhost:8000 ...`). Senza nessun
  # `ports:` il tunnel trova `connection refused` pur funzionando — l'errore n. 3
  # di CLAUDE.md (dashboard.md 8). La regola e' "mai su tutte le interfacce", non
  # "mai una sezione ports:".
  #
  # L'esposizione pubblica non passa mai da qui: davanti alla dashboard c'e'
  # Caddy (fase 2, servizio `caddy` qui sotto), che la raggiunge per nome sulla
  # rete interna. Questo binding resta per il tunnel SSH, che serve /health e
  # affianca log e `docker compose exec`: la guardia del login vale anche da li',
  # di proposito, e il tunnel NON scavalca l'autenticazione (dashboard-fase2.md
  # 8-bis). L'interfaccia senza login si guarda con il fixture in locale
  # (dashboard.md 7). Allargare il binding e' la versione dashboard
  # dell'incidente descritto in CLAUDE.md.
  # tests/test_dashboard_deploy.py fallisce su un binding senza IP o su 0.0.0.0.
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # NESSUN env_file, e non e' una dimenticanza: .env contiene DATABASE_URL e
    # API_DATABASE_URL, e dashboard.md 1 vuole che questo container NON le abbia,
    # non solo che non le usi. L'environment qui sotto e' l'elenco completo di
    # cio' che il container riceve; il processo rifiuta di partire se trova una
    # variabile di database (dashboard/config.py).
    environment:
      # Nessun default: e' configurazione, non codice (dashboard.md 1). `:-` e
      # non `:?`: Compose interpola l'intero file per QUALUNQUE comando, quindi
      # `:?` farebbe fallire anche `docker compose run job` del cron settimanale
      # su un .env che non ha ancora questa riga. Vuota, la fa fallire la
      # dashboard stessa all'avvio, con un messaggio che la nomina.
      KINDLING_API_BASE_URL: ${KINDLING_API_BASE_URL:-}
      # Login Discord (dashboard.md 3, dashboard-fase2.md). Stessa forma, per la
      # stessa ragione: vuota, la dashboard rifiuta di partire nominandola. Il
      # client secret e la chiave di firma della sessione vivono solo nel .env
      # della droplet. Il token del bot (DISCORD_TOKEN) NON entra qui: e' una
      # credenziale distinta della stessa applicazione Discord.
      KINDLING_DISCORD_CLIENT_ID: ${KINDLING_DISCORD_CLIENT_ID:-}
      KINDLING_DISCORD_CLIENT_SECRET: ${KINDLING_DISCORD_CLIENT_SECRET:-}
      KINDLING_SESSION_SECRET: ${KINDLING_SESSION_SECRET:-}
      KINDLING_OAUTH_REDIRECT_URI: ${KINDLING_OAUTH_REDIRECT_URI:-}
    # Margine sopra i 54 MB misurati, ma un tetto (dashboard.md 9).
    mem_limit: 150m
    # 1 worker, per la stessa ragione dell'API: 1 vCPU condiviso con l'heartbeat
    # del gateway Discord. --factory: l'app si costruisce all'avvio leggendo la
    # configurazione OAuth, e una variabile mancante ferma il processo li'.
    # --no-access-log: l'access log di uvicorn scrive la query string, e sul
    # callback OAuth vuol dire il `code` in chiaro nei log (dashboard.md 3).
    # L'access log vive in Caddy, con il `code` filtrato (ops/Caddyfile).
    command:
      ["uvicorn", "dashboard.main:crea_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
       "--workers", "1", "--no-access-log"]
    # /health della dashboard verifica di saper raggiungere l'API: un container
    # vivo che non legge dati non e' un container sano.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # La previsione di api.md 2 ("serve al depends_on: condition: service_healthy
    # del compose quando arrivera' il dashboard") si incassa qui.
    depends_on:
      api:
        condition: service_healthy

  # Caddy: TLS automatico davanti alla sola dashboard, e le pagine legali
  # sull'apex (dashboard-fase2.md 8-bis; la configurazione e' ops/Caddyfile).
  #
  # 80 e 443 su TUTTE le interfacce: e' l'unica eccezione alla regola del
  # progetto, decisa in dashboard.md 8, ed e' stretta — solo questo servizio,
  # solo queste due porte. tests/test_dashboard_deploy.py la misura in entrambe
  # le direzioni: una terza porta di Caddy, o una porta pubblica su un altro
  # servizio, falliscono.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificati e chiave dell'account ACME. Volume NOMINATO, non un
      # dettaglio: senza, ogni ricreazione del container chiede certificati
      # nuovi, e Let's Encrypt ne concede 5 a settimana per lo stesso insieme di
      # nomi — il sesto deploy della settimana lascia il dominio senza
      # certificato, con tutto il resto che funziona. ops/kindling-deploy.sh
      # verifica che /data sia montato su questo volume.
      - caddy_data:/data
      - caddy_config:/config
      - ./legal:/srv/legal:ro
    # ~30 MB misurati (dashboard.md 2): il tetto e' margine, non stima.
    mem_limit: 96m
    # service_started e NON service_healthy: legare Caddy alla salute della
    # dashboard spegnerebbe con lei anche le pagine pubbliche sull'apex e il
    # rinnovo dei certificati. Caddy risolve dashboard:8000 alla richiesta: se
    # il backend e' giu' risponde 502 su quel nome e serve tutto il resto.
    depends_on:
      dashboard:
        condition: service_started

  # Il job non e' un servizio sempre acceso: si lancia a mano o da cron con
  # `docker compose run --rm job ...`. E' definito qui, nello stesso compose di
  # postgres e bot, perche' l'ambiente di riferimento e' la droplet e non
  # esiste una "fase locale" separata da promuovere (vedi architettura.md).
  job:
    build:
      context: .
      args:
        # Incisa nell'immagine (vedi Dockerfile), non letta da .env a runtime:
        # ops/kindling-deploy.sh la calcola da `git rev-parse --short HEAD` e
        # la passa qui come build-arg. Il default vuoto serve solo a chi
        # lancia `docker compose build` senza lo script (sviluppo locale):
        # _code_version() tratta una versione vuota come assente, non come un
        # errore.
        KINDLING_CODE_VERSION: "${KINDLING_CODE_VERSION:-}"
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindling}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kindling}
    # NON aggiungere KINDLING_CODE_VERSION qui ne' in .env (vedi .env.example):
    # env_file e environment vincono sempre sul valore incastonato nell'immagine
    # con l'ARG sopra, quindi una riga anche vuota in .env sovrascriverebbe in
    # silenzio il commit vero con una stringa vuota, e code_version tornerebbe
    # NULL con la build riuscita — il modo in cui questo difetto e' gia'
    # successo una volta.
    # Se qualcosa deve morire per esaurimento memoria su una macchina da 1 GB,
    # deve morire il job, non il bot o Postgres: senza un limite esplicito
    # l'OOM killer sceglie il processo con piu' RSS, che e' il database.
    mem_limit: 400m
    volumes:
      # Gli export GraphML restano sull'host: sono file da aprire in Gephi, non
      # dati del servizio. La cartella e' in .gitignore.
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "job.main", "snapshot"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
